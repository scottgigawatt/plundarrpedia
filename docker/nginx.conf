#
# nginx.conf: Hardened unprivileged static-site server for Plundarrpedia.
#

#
# Serve the generated site and expose a container-local health endpoint.
#
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep server responses predictable and avoid disclosing the Nginx version.
    charset utf-8;
    server_tokens off;

    # Return a dependency-free response for Docker healthchecks.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "shipshape\n";
    }

    # Resolve clean MkDocs URLs while returning a real 404 for missing pages.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Cache fingerprinted static assets while requiring every file to exist.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Apply baseline browser security headers to successful and error responses.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
