#
# .pre-commit-config.yaml: Repository lint, secret baseline, documentation,
#                          workflow, YAML, and Dockerfile validation hooks.
#

repos:
  #
  # Scan changed content for hardcoded secrets before it can be committed.
  #
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  #
  # Compare detected secrets against the reviewed repository baseline.
  #
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  #
  # Run general file hygiene, YAML syntax, and whitespace checks.
  #
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
        exclude: ^mkdocs\.yml$
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]

  #
  # Validate every Markdown document with the shared markdownlint configuration.
  #
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
        pass_filenames: false

  #
  # Enforce strict YAML style for ordinary YAML configuration files.
  #
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        exclude: ^mkdocs\.yml$
        args:
          - "--strict"
          - "-d"
          - "{extends: default, rules: {document-start: disable, line-length: disable, truthy: disable}}"

  #
  # Validate GitHub Actions expressions, permissions, and shell fragments.
  #
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  #
  # Lint the production Dockerfile against container image best practices.
  #
  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint-docker
