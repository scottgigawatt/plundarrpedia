#
# pages.yml: Validate and publish the Plundarrpedia static site to GitHub Pages.
#

name: "Publish the Captain's Charts 📚🏴‍☠️"

#
# Publish Pages when site sources reach main or a maintainer starts the workflow.
#
on:
    push:
        branches:
            - main
        paths:
            - "docs/**"
            - "overrides/**"
            - "mkdocs.yml"
            - "requirements.txt"
            - ".github/workflows/pages.yml"
            - ".github/discord/**"
            - ".github/scripts/discord-notifier.sh"
    workflow_dispatch:

#
# Keep the workflow read-only until the deployment job explicitly requests the
# minimum permissions required by GitHub Pages.
#
permissions:
    contents: read

#
# Allow one Pages deployment at a time without canceling an active publication.
#
concurrency:
    group: github-pages
    cancel-in-progress: false

#
# Build the static artifact separately from the trusted deployment environment.
#
jobs:
    build:
        name: "Draw the Static Map 🗺️"
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            #
            # Check out the public site sources without retaining write credentials.
            #
            - name: "Grab the Logbook 📖"
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
              with:
                  persist-credentials: false

            #
            # Announce the documentation pipeline to Asteres without blocking it.
            #
            - name: "Notify Asteres: documentation started 📚"
              continue-on-error: true
              env:
                  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  WORKFLOW_NAME: ${{ github.workflow }}
                  REPOSITORY: ${{ github.repository }}
                  REF_NAME: ${{ github.ref_name }}
                  ACTOR: ${{ github.actor }}
              run: |
                  sh .github/scripts/discord-notifier.sh \
                      --type docs-start \
                      --profile docs \
                      --image-name Plundarrpedia \
                      --run-url "${RUN_URL}" \
                      --repository "${REPOSITORY}" \
                      --ref-name "${REF_NAME}" \
                      --workflow-name "${WORKFLOW_NAME}" \
                      --actor "${ACTOR}"

            #
            # Install the pinned documentation toolchain with pip caching enabled.
            #
            - name: "Ready the Python Quill 🪶"
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
              with:
                  python-version: "3.15"
                  cache: pip

            - name: "Load the Cartographer's Tools 🧰"
              run: pip install --requirement requirements.txt

            #
            # Configure Pages metadata before rendering so canonical URLs use the
            # repository's active GitHub Pages settings.
            #
            - name: "Configure the Pages Harbor ⚓"
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6

            #
            # Fail on broken navigation, invalid configuration, or build warnings,
            # then package the generated site for the deployment job.
            #
            - name: "Render Every Chart 🔎"
              run: mkdocs build --strict

            - name: "Crate the Site Artifact 📦"
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
              with:
                  path: site

    #
    # Deploy only the immutable artifact produced by the build job.
    #
    deploy:
        name: "Raise the Pages Flag 🚩"
        needs: build
        outputs:
            page-url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            #
            # Publish the artifact and expose its final URL through the environment.
            #
            - name: "Deploy Plundarrpedia 🚀"
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5

    #
    # Report both job results even when a failed build prevents deployment.
    # Only the configured Asteres destination receives documentation updates.
    #
    notify:
        name: "Report the documentation result 📚"
        if: always()
        needs: [build, deploy]
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            #
            # Read the notifier without retaining source credentials.
            #
            - name: "Bring the notification guide 📖"
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
              with:
                  persist-credentials: false

            #
            # Keep delivery failures separate from build and deployment results.
            #
            - name: "Notify Asteres: documentation result 📚"
              continue-on-error: true
              env:
                  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
                  DOCS_BUILD_STATUS: ${{ needs.build.result }}
                  DOCS_DEPLOY_STATUS: ${{ needs.deploy.result }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  WORKFLOW_NAME: ${{ github.workflow }}
                  SITE_URL: ${{ needs.deploy.outputs.page-url }}
                  REPOSITORY: ${{ github.repository }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  sh .github/scripts/discord-notifier.sh \
                      --type docs-verdict \
                      --profile docs \
                      --image-name Plundarrpedia \
                      --build-status "${DOCS_BUILD_STATUS}" \
                      --deploy-status "${DOCS_DEPLOY_STATUS}" \
                      --run-url "${RUN_URL}" \
                      --workflow-name "${WORKFLOW_NAME}" \
                      --site-url "${SITE_URL}" \
                      --repository "${REPOSITORY}" \
                      --ref-name "${REF_NAME}"
