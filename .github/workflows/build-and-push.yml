#
# build-and-push.yml: Scan, build, attest, and publish multi-platform
#                     Plundarrpedia images to GitHub Container Registry.
#

name: "Hoist the Wiki Image 🏴‍☠️"

#
# Publish images when deployable sources reach main, a release tag is created,
# the weekly rebuild runs, or a maintainer starts the workflow manually.
#
on:
    push:
        branches:
            - main
        tags:
            - "v*.*.*"
        paths:
            - "docs/**"
            - "overrides/**"
            - "docker/**"
            - "docker-compose.yml"
            - "mkdocs.yml"
            - "requirements.txt"
            - "Makefile"
            - "example.env"
            - ".github/workflows/build-and-push.yml"
            - ".github/discord/**"
            - ".github/scripts/discord-notifier.sh"
            - "test/helpers/test-discord-notifier.sh"
    schedule:
        - cron: "23 7 * * 1"
    workflow_dispatch:

#
# Deny write access by default. The publishing job grants only the additional
# permissions required to push packages and attach build attestations.
#
permissions:
    contents: read

#
# Build, scan, and publish the production image for every supported platform.
#
jobs:
    build-and-push:
        name: "Pack the Wiki Cargo Hold 🧰"
        if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
            attestations: write
            packages: write

        #
        # Shared registry, platform, and image settings for every build step.
        #
        env:
            REGISTRY: ghcr.io
            IMAGE_PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7
            PLUNDARRPEDIA_IMAGE_REF: ghcr.io/${{ github.repository }}

        steps:
            #
            # Check out full history so annotated release tags can be verified
            # against the main branch before any image is published.
            #
            - name: "Grab the Treasure Map 🗺️"
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            #
            # Announce the trusted image pipeline independently to each optional
            # destination. Delivery failures do not change publication outcomes.
            #
            - name: "Notify Asteres: image started 📣"
              continue-on-error: true
              env:
                  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  WORKFLOW_NAME: ${{ github.workflow }}
                  REPOSITORY: ${{ github.repository }}
                  REF_NAME: ${{ github.ref_name }}
                  ACTOR: ${{ github.actor }}
              run: |
                  sh .github/scripts/discord-notifier.sh \
                      --type image-start \
                      --profile image-primary \
                      --image-name Plundarrpedia \
                      --run-url "${RUN_URL}" \
                      --repository "${REPOSITORY}" \
                      --ref-name "${REF_NAME}" \
                      --workflow-name "${WORKFLOW_NAME}" \
                      --ghcr-image "${PLUNDARRPEDIA_IMAGE_REF}" \
                      --actor "${ACTOR}" \
                      --platforms "${IMAGE_PLATFORMS}"

            - name: "Notify Hades: image started 📣"
              continue-on-error: true
              env:
                  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_HADES_HOOK_URL }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  WORKFLOW_NAME: ${{ github.workflow }}
                  REPOSITORY: ${{ github.repository }}
                  REF_NAME: ${{ github.ref_name }}
                  ACTOR: ${{ github.actor }}
              run: |
                  sh .github/scripts/discord-notifier.sh \
                      --type image-start \
                      --profile image-secondary \
                      --image-name Plundarrpedia \
                      --run-url "${RUN_URL}" \
                      --repository "${REPOSITORY}" \
                      --ref-name "${REF_NAME}" \
                      --workflow-name "${WORKFLOW_NAME}" \
                      --ghcr-image "${PLUNDARRPEDIA_IMAGE_REF}" \
                      --actor "${ACTOR}" \
                      --platforms "${IMAGE_PLATFORMS}"

            - name: "Inspect the Release Chart 🧭"
              id: release-validation
              if: startsWith(github.ref, 'refs/tags/')
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  semver_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))(\.((0|[1-9][0-9]*)|([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'

                  if [[ ! "${RELEASE_TAG}" =~ ${semver_pattern} ]]; then
                    echo "Release tag ${RELEASE_TAG} is not valid semantic versioning."
                    exit 1
                  fi

                  if [ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" != "tag" ]; then
                    echo "Release tag ${RELEASE_TAG} must be annotated."
                    exit 1
                  fi

                  git fetch --no-tags origin main
                  if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
                    echo "Release tag ${RELEASE_TAG} does not point to a commit on main."
                    exit 1
                  fi

            #
            # Configure emulation and Buildx for the published CPU platforms.
            #
            - name: "Summon Cross-Arch Cannons 🧨"
              uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4

            - name: "Sharpen the Build Axe 🪓"
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

            #
            # Authenticate only after release validation succeeds. The token is
            # scoped to this job and used only for GitHub Container Registry.
            #
            - name: "Board the GHCR Galleon 🔐"
              uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            #
            # Capture one UTC creation time for consistent image metadata across
            # the local scan image and the published multi-platform image.
            #
            - name: "Ink the Build Scroll 📜"
              id: build-scroll
              run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"

            #
            # Build one native image and scan it before publishing any manifest.
            # High or critical fixed vulnerabilities fail the workflow.
            #
            - name: "Hammer a Local Inspection Hull ⚒️"
              id: local-image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
              with:
                  context: .
                  file: docker/Dockerfile
                  load: true
                  tags: ${{ env.PLUNDARRPEDIA_IMAGE_REF }}:scan
                  build-args: |
                      IMAGE_CREATED=${{ steps.build-scroll.outputs.created }}
                      IMAGE_REVISION=${{ github.sha }}
                      IMAGE_VERSION=scan

            - name: "Inspect the Wiki for Bilge Rot 🔍"
              id: scan
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
              with:
                  image-ref: ${{ env.PLUNDARRPEDIA_IMAGE_REF }}:scan
                  format: table
                  vuln-type: os,library
                  severity: CRITICAL,HIGH
                  ignore-unfixed: true
                  exit-code: 1

            #
            # Generate branch, commit, and semantic-version tags from the event.
            #
            - name: "Chart Plundarrpedia Tags 🗺️"
              id: meta-plundarrpedia
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
              with:
                  images: ${{ env.PLUNDARRPEDIA_IMAGE_REF }}
                  flavor: |
                      latest=auto
                  tags: |
                      type=edge,branch=main
                      type=sha,prefix=sha-
                      type=semver,pattern={{version}}

            #
            # Publish the scanned source for every supported platform with OCI
            # metadata, an SBOM, and BuildKit provenance.
            #
            - name: "Publish the Multi-Arch Wiki 🚢"
              id: publish-plundarrpedia
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
              with:
                  context: .
                  file: docker/Dockerfile
                  platforms: ${{ env.IMAGE_PLATFORMS }}
                  push: true
                  tags: ${{ steps.meta-plundarrpedia.outputs.tags }}
                  labels: ${{ steps.meta-plundarrpedia.outputs.labels }}
                  annotations: |
                      index:org.opencontainers.image.title=Plundarrpedia
                      index:org.opencontainers.image.description=A one-stop wiki for Plundarr, Privateerr, Plex utilities, and self-hosted media automation.
                      index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      index:org.opencontainers.image.documentation=https://scottgigawatt.github.io/plundarrpedia/
                  build-args: |
                      IMAGE_CREATED=${{ steps.build-scroll.outputs.created }}
                      IMAGE_REVISION=${{ github.sha }}
                      IMAGE_VERSION=${{ steps.meta-plundarrpedia.outputs.version }}
                  sbom: true
                  provenance: true

            #
            # Attach GitHub provenance to the exact manifest digest that was
            # pushed above so consumers can verify the published artifact.
            #
            - name: "Stamp the Provenance Scroll 🧾"
              id: provenance
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
              with:
                  subject-name: ${{ env.PLUNDARRPEDIA_IMAGE_REF }}
                  subject-digest: ${{ steps.publish-plundarrpedia.outputs.digest }}
                  push-to-registry: true

            #
            # Report the final pipeline result independently of webhook delivery.
            # Publication evidence remains visible when later verification fails.
            #
            - name: "Notify Asteres: image result 📣"
              if: always()
              continue-on-error: true
              env:
                  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  WORKFLOW_NAME: ${{ github.workflow }}
                  REPOSITORY: ${{ github.repository }}
                  REF_NAME: ${{ github.ref_name }}
                  JOB_STATUS: ${{ job.status }}
                  PUBLICATION_STATUS: ${{ steps.publish-plundarrpedia.outcome }}
                  RELEASE_STATUS: ${{ steps.release-validation.outcome }}
                  BUILD_STATUS: ${{ steps.local-image.outcome }}
                  SCAN_STATUS: ${{ steps.scan.outcome }}
                  PROVENANCE_STATUS: ${{ steps.provenance.outcome }}
                  PUBLISHED_TAGS: ${{ steps.meta-plundarrpedia.outputs.tags }}
                  PUBLISHED_DIGEST: ${{ steps.publish-plundarrpedia.outputs.digest }}
              run: |
                  failure_stage="image pipeline"

                  if [ "${RELEASE_STATUS}" = "failure" ]; then
                      failure_stage="release validation"
                  elif [ "${BUILD_STATUS}" = "failure" ]; then
                      failure_stage="local image build"
                  elif [ "${SCAN_STATUS}" = "failure" ]; then
                      failure_stage="vulnerability scan"
                  elif [ "${PUBLICATION_STATUS}" = "failure" ]; then
                      failure_stage="GHCR publication"
                  elif [ "${PROVENANCE_STATUS}" = "failure" ]; then
                      failure_stage="provenance verification"
                  fi

                  sh .github/scripts/discord-notifier.sh \
                      --type image-verdict \
                      --profile image-primary \
                      --image-name Plundarrpedia \
                      --run-url "${RUN_URL}" \
                      --repository "${REPOSITORY}" \
                      --ref-name "${REF_NAME}" \
                      --workflow-name "${WORKFLOW_NAME}" \
                      --ghcr-image "${PLUNDARRPEDIA_IMAGE_REF}" \
                      --job-status "${JOB_STATUS}" \
                      --publication-status "${PUBLICATION_STATUS}" \
                      --failure-stage "${failure_stage}" \
                      --ghcr-package-url "${GITHUB_SERVER_URL}/${REPOSITORY}/pkgs/container/plundarrpedia" \
                      --published-tags "${PUBLISHED_TAGS}" \
                      --published-digest "${PUBLISHED_DIGEST}"

            - name: "Notify Hades: image result 📣"
              if: always()
              continue-on-error: true
              env:
                  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_HADES_HOOK_URL }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  WORKFLOW_NAME: ${{ github.workflow }}
                  REPOSITORY: ${{ github.repository }}
                  REF_NAME: ${{ github.ref_name }}
                  JOB_STATUS: ${{ job.status }}
                  PUBLICATION_STATUS: ${{ steps.publish-plundarrpedia.outcome }}
                  RELEASE_STATUS: ${{ steps.release-validation.outcome }}
                  BUILD_STATUS: ${{ steps.local-image.outcome }}
                  SCAN_STATUS: ${{ steps.scan.outcome }}
                  PROVENANCE_STATUS: ${{ steps.provenance.outcome }}
                  PUBLISHED_TAGS: ${{ steps.meta-plundarrpedia.outputs.tags }}
                  PUBLISHED_DIGEST: ${{ steps.publish-plundarrpedia.outputs.digest }}
              run: |
                  failure_stage="image pipeline"

                  if [ "${RELEASE_STATUS}" = "failure" ]; then
                      failure_stage="release validation"
                  elif [ "${BUILD_STATUS}" = "failure" ]; then
                      failure_stage="local image build"
                  elif [ "${SCAN_STATUS}" = "failure" ]; then
                      failure_stage="vulnerability scan"
                  elif [ "${PUBLICATION_STATUS}" = "failure" ]; then
                      failure_stage="GHCR publication"
                  elif [ "${PROVENANCE_STATUS}" = "failure" ]; then
                      failure_stage="provenance verification"
                  fi

                  sh .github/scripts/discord-notifier.sh \
                      --type image-verdict \
                      --profile image-secondary \
                      --image-name Plundarrpedia \
                      --run-url "${RUN_URL}" \
                      --repository "${REPOSITORY}" \
                      --ref-name "${REF_NAME}" \
                      --workflow-name "${WORKFLOW_NAME}" \
                      --ghcr-image "${PLUNDARRPEDIA_IMAGE_REF}" \
                      --job-status "${JOB_STATUS}" \
                      --publication-status "${PUBLICATION_STATUS}" \
                      --failure-stage "${failure_stage}" \
                      --ghcr-package-url "${GITHUB_SERVER_URL}/${REPOSITORY}/pkgs/container/plundarrpedia" \
                      --published-tags "${PUBLISHED_TAGS}" \
                      --published-digest "${PUBLISHED_DIGEST}"
