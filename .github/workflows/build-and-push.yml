#
# build-and-push.yml: Scan, build, attest, and publish multi-platform
#                     Plundarrpedia images to GitHub Container Registry.
#

name: "Hoist the Wiki Image 🏴‍☠️"

#
# Publish images when deployable sources reach main, a release tag is created,
# the weekly rebuild runs, or a maintainer starts the workflow manually.
#
on:
    push:
        branches:
            - main
        tags:
            - "v*.*.*"
        paths:
            - "docs/**"
            - "overrides/**"
            - "docker/**"
            - "docker-compose.yml"
            - "mkdocs.yml"
            - "requirements.txt"
            - "Makefile"
            - "example.env"
            - ".github/workflows/build-and-push.yml"
    schedule:
        - cron: "23 7 * * 1"
    workflow_dispatch:

#
# Deny write access by default. The publishing job grants only the additional
# permissions required to push packages and attach build attestations.
#
permissions:
    contents: read

#
# Build, scan, and publish the production image for every supported platform.
#
jobs:
    build-and-push:
        name: "Pack the Wiki Cargo Hold 🧰"
        if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
            attestations: write
            packages: write

        #
        # Shared registry, platform, and image settings for every build step.
        #
        env:
            REGISTRY: ghcr.io
            IMAGE_PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7
            PLUNDARRPEDIA_IMAGE_REF: ghcr.io/${{ github.repository }}

        steps:
            #
            # Announce the start independently to each optional Discord webhook.
            # Missing webhooks skip cleanly without blocking the build.
            #
            - name: "Notify Discord: build started 📣"
              env:
                  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  WORKFLOW_NAME: ${{ github.workflow }}
                  REF_NAME: ${{ github.ref_name }}
                  ACTOR: ${{ github.actor }}
                  REPOSITORY: ${{ github.repository }}
                  GHCR_IMAGE_REF: ${{ env.PLUNDARRPEDIA_IMAGE_REF }}
                  IMAGE_PLATFORMS: ${{ env.IMAGE_PLATFORMS }}
              run: |
                  if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
                    echo "DISCORD_WEBHOOK_URL is not set; skipping Discord notification."
                    exit 0
                  fi

                  embed_colors=(16711884 15961002 11685080 10181046 15844367 16738740)
                  color="${embed_colors[$((RANDOM % ${#embed_colors[@]}))]}"

                  payload="$(jq -n \
                    --arg title "🗺️ Plundarrpedia left the map room" \
                    --arg description "${WORKFLOW_NAME} is building the wiki image. The cartographer brought a cannon." \
                    --arg url "${RUN_URL}" \
                    --arg repository "${REPOSITORY}" \
                    --arg ref "${REF_NAME}" \
                    --arg actor "${ACTOR}" \
                    --arg platforms "${IMAGE_PLATFORMS}" \
                    --arg ghcr "${GHCR_IMAGE_REF}" \
                    --argjson color "${color}" \
                    '{
                      username: "Plundarrpedia Builds",
                      embeds: [{
                        title: $title,
                        description: $description,
                        url: $url,
                        color: $color,
                        fields: [
                          {name: "📚 Repo", value: $repository, inline: true},
                          {name: "🌿 Ref", value: $ref, inline: true},
                          {name: "🧑‍✈️ Captain", value: $actor, inline: true},
                          {name: "🧱 Platforms", value: $platforms, inline: false},
                          {name: "📦 GHCR Cargo", value: $ghcr, inline: false}
                        ],
                        footer: {text: "If the charts catch fire, check the logs."},
                        timestamp: now | todate
                      }]
                    }')"

                  curl \
                    --fail \
                    --silent \
                    --show-error \
                    --header "Content-Type: application/json" \
                    --data "${payload}" \
                    "${DISCORD_WEBHOOK_URL}"

            - name: "Notify Hades Discord: build started 🔥"
              env:
                  DISCORD_HADES_HOOK_URL: ${{ secrets.DISCORD_HADES_HOOK_URL }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  WORKFLOW_NAME: ${{ github.workflow }}
                  REF_NAME: ${{ github.ref_name }}
                  ACTOR: ${{ github.actor }}
                  REPOSITORY: ${{ github.repository }}
                  GHCR_IMAGE_REF: ${{ env.PLUNDARRPEDIA_IMAGE_REF }}
                  IMAGE_PLATFORMS: ${{ env.IMAGE_PLATFORMS }}
              run: |
                  if [ -z "${DISCORD_HADES_HOOK_URL}" ]; then
                    echo "DISCORD_HADES_HOOK_URL is not set; skipping Hades Discord notification."
                    exit 0
                  fi

                  embed_colors=(16711884 15961002 11685080 10181046 15844367 16738740)
                  color="${embed_colors[$((RANDOM % ${#embed_colors[@]}))]}"

                  payload="$(jq -n \
                    --arg title "🔥 The wiki forge opened a cursed footnote" \
                    --arg description "${WORKFLOW_NAME} entered the underworld carrying Markdown and unreasonable confidence." \
                    --arg url "${RUN_URL}" \
                    --arg repository "${REPOSITORY}" \
                    --arg ref "${REF_NAME}" \
                    --arg actor "${ACTOR}" \
                    --arg platforms "${IMAGE_PLATFORMS}" \
                    --arg ghcr "${GHCR_IMAGE_REF}" \
                    --argjson color "${color}" \
                    '{
                      username: "Hades Build Bureau",
                      embeds: [{
                        title: $title,
                        description: $description,
                        url: $url,
                        color: $color,
                        fields: [
                          {name: "🏛️ Repo", value: $repository, inline: true},
                          {name: "🩸 Ref", value: $ref, inline: true},
                          {name: "😈 Summoner", value: $actor, inline: true},
                          {name: "🧱 Platforms", value: $platforms, inline: false},
                          {name: "📦 GHCR Cauldron", value: $ghcr, inline: false}
                        ],
                        footer: {text: "Hades Build Bureau: mostly fire, some paperwork."},
                        timestamp: now | todate
                      }]
                    }')"

                  curl \
                    --fail \
                    --silent \
                    --show-error \
                    --header "Content-Type: application/json" \
                    --data "${payload}" \
                    "${DISCORD_HADES_HOOK_URL}"

            #
            # Check out full history so annotated release tags can be verified
            # against the main branch before any image is published.
            #
            - name: "Grab the Treasure Map 🗺️"
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: "Inspect the Release Chart 🧭"
              if: startsWith(github.ref, 'refs/tags/')
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  semver_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))(\.((0|[1-9][0-9]*)|([0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'

                  if [[ ! "${RELEASE_TAG}" =~ ${semver_pattern} ]]; then
                    echo "Release tag ${RELEASE_TAG} is not valid semantic versioning."
                    exit 1
                  fi

                  if [ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" != "tag" ]; then
                    echo "Release tag ${RELEASE_TAG} must be annotated."
                    exit 1
                  fi

                  git fetch --no-tags origin main
                  if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
                    echo "Release tag ${RELEASE_TAG} does not point to a commit on main."
                    exit 1
                  fi

            #
            # Configure emulation and Buildx for the published CPU platforms.
            #
            - name: "Summon Cross-Arch Cannons 🧨"
              uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4

            - name: "Sharpen the Build Axe 🪓"
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

            #
            # Authenticate only after release validation succeeds. The token is
            # scoped to this job and used only for GitHub Container Registry.
            #
            - name: "Board the GHCR Galleon 🔐"
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            #
            # Capture one UTC creation time for consistent image metadata across
            # the local scan image and the published multi-platform image.
            #
            - name: "Ink the Build Scroll 📜"
              id: build-scroll
              run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"

            #
            # Build one native image and scan it before publishing any manifest.
            # High or critical fixed vulnerabilities fail the workflow.
            #
            - name: "Hammer a Local Inspection Hull ⚒️"
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
              with:
                  context: .
                  file: docker/Dockerfile
                  load: true
                  tags: ${{ env.PLUNDARRPEDIA_IMAGE_REF }}:scan
                  build-args: |
                      IMAGE_CREATED=${{ steps.build-scroll.outputs.created }}
                      IMAGE_REVISION=${{ github.sha }}
                      IMAGE_VERSION=scan

            - name: "Inspect the Wiki for Bilge Rot 🔍"
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
              with:
                  image-ref: ${{ env.PLUNDARRPEDIA_IMAGE_REF }}:scan
                  format: table
                  vuln-type: os,library
                  severity: CRITICAL,HIGH
                  ignore-unfixed: true
                  exit-code: 1

            #
            # Generate branch, commit, and semantic-version tags from the event.
            #
            - name: "Chart Plundarrpedia Tags 🗺️"
              id: meta-plundarrpedia
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
              with:
                  images: ${{ env.PLUNDARRPEDIA_IMAGE_REF }}
                  flavor: |
                      latest=auto
                  tags: |
                      type=edge,branch=main
                      type=sha,prefix=sha-
                      type=semver,pattern={{version}}

            #
            # Publish the scanned source for every supported platform with OCI
            # metadata, an SBOM, and BuildKit provenance.
            #
            - name: "Publish the Multi-Arch Wiki 🚢"
              id: publish-plundarrpedia
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
              with:
                  context: .
                  file: docker/Dockerfile
                  platforms: ${{ env.IMAGE_PLATFORMS }}
                  push: true
                  tags: ${{ steps.meta-plundarrpedia.outputs.tags }}
                  labels: ${{ steps.meta-plundarrpedia.outputs.labels }}
                  annotations: |
                      index:org.opencontainers.image.title=Plundarrpedia
                      index:org.opencontainers.image.description=A one-stop wiki for Plundarr, Privateerr, Plex utilities, and self-hosted media automation.
                      index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      index:org.opencontainers.image.documentation=https://scottgigawatt.github.io/plundarrpedia/
                  build-args: |
                      IMAGE_CREATED=${{ steps.build-scroll.outputs.created }}
                      IMAGE_REVISION=${{ github.sha }}
                      IMAGE_VERSION=${{ steps.meta-plundarrpedia.outputs.version }}
                  sbom: true
                  provenance: true

            #
            # Attach GitHub provenance to the exact manifest digest that was
            # pushed above so consumers can verify the published artifact.
            #
            - name: "Stamp the Provenance Scroll 🧾"
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
              with:
                  subject-name: ${{ env.PLUNDARRPEDIA_IMAGE_REF }}
                  subject-digest: ${{ steps.publish-plundarrpedia.outputs.digest }}
                  push-to-registry: true

            #
            # Collect compact tag and digest details for final notifications even
            # when an earlier publication step failed.
            #
            - name: "Collect publish summary 📊"
              id: publish-summary
              if: always()
              env:
                  PLUNDARRPEDIA_TAGS: ${{ steps.meta-plundarrpedia.outputs.tags }}
                  PLUNDARRPEDIA_DIGEST: ${{ steps.publish-plundarrpedia.outputs.digest }}
              run: |
                  {
                    echo "tags<<EOF"
                    printf '%s\n' "${PLUNDARRPEDIA_TAGS:-none}"
                    echo "EOF"
                    echo "digest=${PLUNDARRPEDIA_DIGEST:-unavailable}"
                  } >> "${GITHUB_OUTPUT}"

            #
            # Report the final job state to both optional Discord destinations.
            # These steps always run so a failed publication never disappears.
            #
            - name: "Notify Discord: build finished 📣"
              if: always()
              env:
                  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
                  JOB_STATUS: ${{ job.status }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  REPOSITORY: ${{ github.repository }}
                  REF_NAME: ${{ github.ref_name }}
                  GHCR_IMAGE_REF: ${{ env.PLUNDARRPEDIA_IMAGE_REF }}
                  GHCR_PACKAGE_URL: ${{ github.server_url }}/${{ github.repository }}/pkgs/container/plundarrpedia
                  PLUNDARRPEDIA_TAGS: ${{ steps.publish-summary.outputs.tags }}
                  GHCR_DIGEST: ${{ steps.publish-summary.outputs.digest }}
              run: |
                  if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
                    echo "DISCORD_WEBHOOK_URL is not set; skipping Discord notification."
                    exit 0
                  fi

                  if [ "${JOB_STATUS}" = "success" ]; then
                    title="✅ The wiki image made port"
                    description="The charts are rendered, scanned, attested, and aboard GHCR."
                  else
                    title="💥 The wiki image sailed into a 404"
                    description="Workflow ended ${JOB_STATUS}. The logs know which chart was upside down."
                  fi
                  embed_colors=(16711884 15961002 11685080 10181046 15844367 16738740)
                  color="${embed_colors[$((RANDOM % ${#embed_colors[@]}))]}"

                  formatted_tags="$(printf '%s\n' "${PLUNDARRPEDIA_TAGS:-none}" \
                    | sed '/^$/d; s#^'"${GHCR_IMAGE_REF}"':##; s/^/• /')"
                  [ -n "${formatted_tags}" ] || formatted_tags="none"
                  ghcr_digest_short="$(printf '%s' "${GHCR_DIGEST:-unavailable}" | sed -E 's/^(sha256:[0-9a-f]{12}).*/\1/')"

                  payload="$(jq -n \
                    --arg title "${title}" \
                    --arg description "${description}" \
                    --arg url "${RUN_URL}" \
                    --arg repository "${REPOSITORY}" \
                    --arg ref "${REF_NAME}" \
                    --arg tags "${formatted_tags}" \
                    --arg ghcrDigest "${ghcr_digest_short}" \
                    --arg ghcrUrl "${GHCR_PACKAGE_URL}" \
                    --argjson color "${color}" \
                    '{
                      username: "Plundarrpedia Builds",
                      embeds: [{
                        title: $title,
                        description: $description,
                        url: $url,
                        color: $color,
                        fields: [
                          {name: "📚 Repo", value: $repository, inline: true},
                          {name: "🌿 Ref", value: $ref, inline: true},
                          {name: "🏷️ Tags", value: $tags, inline: false},
                          {name: "🧾 GHCR Digest", value: $ghcrDigest, inline: false},
                          {name: "📦 GHCR", value: $ghcrUrl, inline: false}
                        ],
                        footer: {text: "Plundarrpedia: serving charts without the sea spray."},
                        timestamp: now | todate
                      }]
                    }')"

                  curl \
                    --fail \
                    --silent \
                    --show-error \
                    --header "Content-Type: application/json" \
                    --data "${payload}" \
                    "${DISCORD_WEBHOOK_URL}"

            - name: "Notify Hades Discord: build finished 🔥"
              if: always()
              env:
                  DISCORD_HADES_HOOK_URL: ${{ secrets.DISCORD_HADES_HOOK_URL }}
                  JOB_STATUS: ${{ job.status }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  REPOSITORY: ${{ github.repository }}
                  REF_NAME: ${{ github.ref_name }}
                  GHCR_IMAGE_REF: ${{ env.PLUNDARRPEDIA_IMAGE_REF }}
                  GHCR_PACKAGE_URL: ${{ github.server_url }}/${{ github.repository }}/pkgs/container/plundarrpedia
                  PLUNDARRPEDIA_TAGS: ${{ steps.publish-summary.outputs.tags }}
                  GHCR_DIGEST: ${{ steps.publish-summary.outputs.digest }}
              run: |
                  if [ -z "${DISCORD_HADES_HOOK_URL}" ]; then
                    echo "DISCORD_HADES_HOOK_URL is not set; skipping Hades Discord notification."
                    exit 0
                  fi

                  if [ "${JOB_STATUS}" = "success" ]; then
                    title="😈 The infernal wiki press says done"
                    description="The image escaped the underworld with its provenance paperwork."
                  else
                    title="💀 The cursed footnote ate the build"
                    description="Pipeline ended ${JOB_STATUS}. Cerberus is reviewing the YAML."
                  fi
                  embed_colors=(16711884 15961002 11685080 10181046 15844367 16738740)
                  color="${embed_colors[$((RANDOM % ${#embed_colors[@]}))]}"

                  formatted_tags="$(printf '%s\n' "${PLUNDARRPEDIA_TAGS:-none}" \
                    | sed '/^$/d; s#^'"${GHCR_IMAGE_REF}"':##; s/^/• /')"
                  [ -n "${formatted_tags}" ] || formatted_tags="none"
                  ghcr_digest_short="$(printf '%s' "${GHCR_DIGEST:-unavailable}" | sed -E 's/^(sha256:[0-9a-f]{12}).*/\1/')"

                  payload="$(jq -n \
                    --arg title "${title}" \
                    --arg description "${description}" \
                    --arg url "${RUN_URL}" \
                    --arg repository "${REPOSITORY}" \
                    --arg ref "${REF_NAME}" \
                    --arg tags "${formatted_tags}" \
                    --arg ghcrDigest "${ghcr_digest_short}" \
                    --arg ghcrUrl "${GHCR_PACKAGE_URL}" \
                    --argjson color "${color}" \
                    '{
                      username: "Hades Build Bureau",
                      embeds: [{
                        title: $title,
                        description: $description,
                        url: $url,
                        color: $color,
                        fields: [
                          {name: "🏛️ Repo", value: $repository, inline: true},
                          {name: "🩸 Ref", value: $ref, inline: true},
                          {name: "🏷️ Tags", value: $tags, inline: false},
                          {name: "🧾 GHCR Digest", value: $ghcrDigest, inline: false},
                          {name: "📦 GHCR", value: $ghcrUrl, inline: false}
                        ],
                        footer: {text: "Hades Build Bureau: fire in, documentation out."},
                        timestamp: now | todate
                      }]
                    }')"

                  curl \
                    --fail \
                    --silent \
                    --show-error \
                    --header "Content-Type: application/json" \
                    --data "${payload}" \
                    "${DISCORD_HADES_HOOK_URL}"
