  vpn-flow.svg: Separate VPN configuration and download traffic paths.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 790" role="img" aria-labelledby="title desc">
  <title id="title">VPN configuration and download traffic</title>
  <desc id="desc">Privateerr writes WireGuard configuration and PIA settings that Gluetun reads. Privateerr can also send recovery settings directly to Gluetun's API. qBittorrent shares Gluetun's network and sends torrent traffic through Gluetun's VPN tunnel to PIA.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#365a74" stroke-width="1.7"/></marker>
    <style>
      text { fill: #182a3a; font-family: system-ui, sans-serif; font-size: 19px; text-anchor: middle; }
      .heading { font-size: 23px; font-weight: 700; }
      .name { font-weight: 700; }
      .small { font-size: 16px; }
      .node { fill: #ffffff; stroke: #627e91; stroke-width: 2; }
      .line { fill: none; stroke: #365a74; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="600" height="790" rx="16" fill="#f2f6f9"/>
  <text x="300" y="39" class="heading">1. Prepare and recover the VPN</text>
  <rect x="160" y="63" width="280" height="65" rx="10" class="node"/>
  <text x="300" y="91" class="name">Privateerr container</text>
  <text x="300" y="115" class="small">Stays outside the VPN network</text>
  <path d="M300 128 V182" class="line"/>
  <text x="346" y="162" class="small">writes</text>
  <rect x="130" y="190" width="340" height="65" rx="10" class="node"/>
  <text x="300" y="218" class="name">Shared configuration files</text>
  <text x="300" y="242" class="small">WireGuard + matching PIA settings</text>
  <path d="M300 255 V309" class="line"/>
  <text x="360" y="290" class="small">reads at startup</text>
  <rect x="160" y="317" width="280" height="65" rx="10" class="node"/>
  <text x="300" y="345" class="name">Gluetun container</text>
  <text x="300" y="369" class="small">Connects the VPN tunnel</text>
  <path d="M440 95 H544 V350 H450" class="line" stroke-dasharray="6 5"/>
  <rect x="460" y="193" width="112" height="72" rx="5" fill="#f2f6f9"/>
  <text x="516" y="214" class="small">Recovery</text>
  <text x="516" y="236" class="small">through</text>
  <text x="516" y="258" class="small">internal API</text>
  <path d="M28 415 H572" stroke="#b9c9d4"/>
  <text x="300" y="451" class="heading">2. Send download traffic</text>
  <rect x="85" y="470" width="430" height="207" rx="14" fill="#e0eef4" stroke="#627e91" stroke-width="2"/>
  <text x="300" y="497" class="small">Gluetun's shared network</text>
  <rect x="155" y="514" width="290" height="54" rx="10" class="node"/>
  <text x="300" y="548" class="name">qBittorrent</text>
  <path d="M300 568 V603" class="line"/>
  <rect x="155" y="612" width="290" height="48" rx="10" class="node"/>
  <text x="300" y="643" class="name">Gluetun VPN tunnel</text>
  <path d="M300 660 V722" class="line"/>
  <text x="416" y="707" class="small">Encrypted traffic</text>
  <rect x="155" y="732" width="290" height="42" rx="10" class="node"/>
  <text x="300" y="760" class="name">PIA VPN server</text>
</svg>
