# docker-compose.yml: Docker Compose configuration for building and running
#                     Plundarrpedia on Docker hosts and NAS platforms.
#

#
# Labels for containers that should not be updated unattended by Watchtower.
#
x-disable-watchtower-updates: &disable-watchtower-updates  # Disable unattended Watchtower updates
  - "com.centurylinklabs.watchtower.enable=false"          # Require intentional updates for this container

#
# Shared healthcheck timing settings.
#
x-default-healthcheck-settings: &default-healthcheck-settings  # YAML anchor for healthcheck settings
  interval: ${DEFAULT_HEALTHCHECK_INTERVAL}                    # Run the check at this interval
  timeout: ${DEFAULT_HEALTHCHECK_TIMEOUT}                      # Fail if it exceeds this duration
  start_period: ${DEFAULT_HEALTHCHECK_START_PERIOD}            # Grace period before checks start
  retries: ${DEFAULT_HEALTHCHECK_RETRIES}                      # Mark as unhealthy after failures

#
# Shared container log rotation settings.
#
x-default-logging: &default-logging  # YAML anchor for logging settings
  driver: json-file                 # Use Docker's local JSON log driver
  options:                          # Bound log growth on long-running hosts
    max-file: "3"                   # Keep three rotated log files
    max-size: 10m                   # Rotate each file after ten megabytes

#
# Define the services used in this stack.
#
services:
  #
  # Configure the service that serves the generated Plundarrpedia site.
  #
  plundarrpedia:
    # Docker image build and container information
    image: ${PLUNDARRPEDIA_IMAGE_REF}:${PLUNDARRPEDIA_TAG}  # Published or locally built image
    build:                                                  # Define build context and arguments
      context: .                                            # Repository root containing the wiki sources
      dockerfile: docker/Dockerfile                         # Production multi-stage Dockerfile
      args:                                                 # Arguments passed to the image build
        MKDOCS_MATERIAL_IMAGE: ${MKDOCS_MATERIAL_IMAGE}            # MkDocs Material image repository
        MKDOCS_MATERIAL_TAG: ${MKDOCS_MATERIAL_TAG}                # Pinned MkDocs Material version and digest
        NGINX_UNPRIVILEGED_IMAGE: ${NGINX_UNPRIVILEGED_IMAGE}      # Unprivileged Nginx image repository
        NGINX_UNPRIVILEGED_TAG: ${NGINX_UNPRIVILEGED_TAG}          # Pinned Nginx version and digest
        IMAGE_CREATED: ${IMAGE_CREATED}                            # OCI image creation timestamp
        IMAGE_REVISION: ${IMAGE_REVISION}                          # OCI image source revision
        IMAGE_VERSION: ${IMAGE_VERSION}                            # OCI image version
    container_name: plundarrpedia-${PLUNDARRPEDIA_TAG}       # Container name including the image tag
    restart: unless-stopped                                  # Restart after host reboots unless stopped
    hostname: plundarrpedia                                  # Set the hostname inside the container
    read_only: true                                          # Prevent writes to the container filesystem

    # Drop privileges that are unnecessary for a static web server
    security_opt:
      - no-new-privileges:true  # Prevent processes from gaining new privileges
    cap_drop:
      - ALL  # Remove every Linux capability from the runtime

    # Provide the only writable runtime path as an in-memory filesystem
    tmpfs:
      - /tmp:size=16m,mode=1777  # Nginx temporary runtime files

    # Publish the internal unprivileged web server port
    ports:
      - "${PLUNDARRPEDIA_HOST_PORT}:8080"  # Configurable host port to the image's fixed HTTP port

    # Bound the resources used by the static site container
    mem_limit: ${PLUNDARRPEDIA_MEM_LIMIT}      # Maximum container memory
    cpu_shares: ${PLUNDARRPEDIA_CPU_SHARES}    # Relative CPU scheduling weight

    # Apply update and log handling policies
    labels: *disable-watchtower-updates  # Update the documentation image intentionally
    logging: *default-logging            # Rotate the container's access and error logs

    # Verify that the static web server responds from inside the container
    healthcheck:
      <<: *default-healthcheck-settings  # Pull in default healthcheck settings
      test:                              # Request the dedicated health endpoint
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/healthz
